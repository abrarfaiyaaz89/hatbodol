<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Settings - HATBODOL</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="settings">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <div class="container">
      <div class="settings">
        <h1>Settings</h1>
        <div class="srow">
          <div><strong id="lbl-dark">Dark mode</strong><small>Easier on the eyes at night</small></div>
          <button class="switch" id="sw-dark" type="button" role="switch" aria-checked="false" aria-labelledby="lbl-dark"><span class="knob"></span></button>
        </div>
        <div class="srow">
          <div><strong id="lbl-fx">Sound &amp; vibration</strong><small>Soft taps and feedback (vibration works on Android)</small></div>
          <button class="switch" id="sw-fx" type="button" role="switch" aria-checked="false" aria-labelledby="lbl-fx"><span class="knob"></span></button>
        </div>
        <div class="srow"><a class="link" href="auth.html">My account and profile</a></div>
        <div class="srow"><a class="link" href="privacy.html">Privacy &amp; Terms</a></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>
  <script src="layout.js"></script>
  <script src="settings.js"></script>
</body>
</html>
