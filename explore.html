<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Explore - HATBODOL</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="explore">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <div class="container">
      <h1>Explore</h1>
      <div class="field"><label for="q">Search listings</label>
        <input id="q" type="search" placeholder="Search by title or category" autocomplete="off"></div>
      <div class="chips-row" id="chips" role="group" aria-label="Category filter"></div>
      <p id="note" class="msg" role="status" aria-live="polite">Loading...</p>
      <div id="grid" class="lgrid"></div>
      <p class="center"><button class="btn" id="more" type="button" hidden>Load more</button></p>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>
  <script src="layout.js"></script>
  <script type="module" src="explore.js"></script>
</body>
</html>
