<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Login - HATBODOL</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="profile">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main" class="gl-page">
    <svg class="gl-lines draw" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g><path pathLength="1" d="M-60 90 C 100 20, 240 190, 400 110 S 700 40, 860 120"/><path pathLength="1" d="M-60 130 C 100 60, 240 230, 400 150 S 700 80, 860 160"/><path pathLength="1" d="M-60 170 C 100 100, 240 270, 400 190 S 700 120, 860 200"/></g><g><path pathLength="1" d="M-60 250 C 100 180, 240 350, 400 270 S 700 200, 860 280"/><path pathLength="1" d="M-60 290 C 100 220, 240 390, 400 310 S 700 240, 860 320"/><path pathLength="1" d="M-60 330 C 100 260, 240 430, 400 350 S 700 280, 860 360"/></g></svg>
    <div class="gl-glow g1"></div><div class="gl-glow g2"></div>
    <div class="container">
      <p id="gl-loading" class="gl-loading">Loading...</p>
      <section class="gl-card" id="gl-card" hidden>
        <div class="gl-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></div>
        <h1 id="gl-title">Login</h1>
        <p class="gl-sub" id="gl-sub">Welcome back, please sign in</p>
        <p id="msg" class="gl-msg" role="status" aria-live="polite"></p>

        <form id="form-login" novalidate>
          <div class="gl-field"><label class="visually-hidden" for="login-email">Email address</label><span class="gl-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
          <input id="login-email" type="email" placeholder="Email address" autocomplete="email" required></div>
          <div class="gl-field"><label class="visually-hidden" for="login-password">Password</label><span class="gl-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>
          <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required><button type="button" class="gl-eye" data-eye="login-password" aria-label="Show password" aria-pressed="false"><span class="eye-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="eye-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6 0 10 7 10 7a17 17 0 01-3.2 3.9M6.6 6.6A17 17 0 002 12s4 7 10 7a9.7 9.7 0 004.4-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg></span></button></div>
          <div class="gl-row">
            <label class="gl-check"><input type="checkbox" id="remember" checked><span>Remember me</span></label>
            <button type="button" class="gl-link" data-mode="reset">Forgot password?</button>
          </div>
          <button class="gl-btn" type="submit">Login</button>
        </form>

        <form id="form-register" hidden novalidate>
          <div class="gl-field"><label class="visually-hidden" for="reg-name">Full name</label><span class="gl-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>
          <input id="reg-name" type="text" placeholder="Full name" autocomplete="name" required></div>
          <div class="gl-field"><label class="visually-hidden" for="reg-email">Email address</label><span class="gl-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
          <input id="reg-email" type="email" placeholder="Email address" autocomplete="email" required></div>
          <div class="gl-field"><label class="visually-hidden" for="reg-password">Password, at least 8 characters</label><span class="gl-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>
          <input id="reg-password" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" minlength="8" required><button type="button" class="gl-eye" data-eye="reg-password" aria-label="Show password" aria-pressed="false"><span class="eye-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="eye-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6 0 10 7 10 7a17 17 0 01-3.2 3.9M6.6 6.6A17 17 0 002 12s4 7 10 7a9.7 9.7 0 004.4-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg></span></button></div>
          <div class="gl-field"><label class="visually-hidden" for="reg-password2">Confirm password</label><span class="gl-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>
          <input id="reg-password2" type="password" placeholder="Confirm password" autocomplete="new-password" required><button type="button" class="gl-eye" data-eye="reg-password2" aria-label="Show password" aria-pressed="false"><span class="eye-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="eye-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6 0 10 7 10 7a17 17 0 01-3.2 3.9M6.6 6.6A17 17 0 002 12s4 7 10 7a9.7 9.7 0 004.4-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg></span></button></div>
          <button class="gl-btn" type="submit">Create account</button>
        </form>

        <form id="form-reset" hidden novalidate>
          <div class="gl-field"><label class="visually-hidden" for="reset-email">Email address</label><span class="gl-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
          <input id="reset-email" type="email" placeholder="Email address" autocomplete="email" required></div>
          <button class="gl-btn" type="submit">Send reset link</button>
        </form>

        <div class="gl-or"><span>or continue with</span></div>
        <button class="gl-google" id="btn-google" type="button"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span>Continue with Google</span></button>

        <p class="gl-switch" data-for="login">New here? <button type="button" class="gl-link" data-mode="register">Create an account</button></p>
        <p class="gl-switch" data-for="register reset" hidden>Already have an account? <button type="button" class="gl-link" data-mode="login">Back to login</button></p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>
  <script src="layout.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
